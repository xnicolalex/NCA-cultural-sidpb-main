events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    charset utf-8;
    client_max_body_size 5G;

    #  SIDPB (SPRING BOOT + NEXT.JS) 
    server {
        listen 80;
        server_name api.spring.ufma.br;

        # Frontend SIDPB (Next.js)
        location / {
            proxy_pass http://sidpb_frontend:3000;
            proxy_redirect default;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # API do Spring Boot
        location /api {
            proxy_pass http://sidpb_backend:8080;
            proxy_redirect default;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # CORS para o frontend
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Headers 'Content-Type, Authorization' always;
            add_header Access-Control-Allow-Methods 'GET,POST,PUT,DELETE,OPTIONS' always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }
    }

    #  CULTURA MARANHENSE (NEXT.JS FULLSTACK) 
    server {
        listen 80;
        server_name node.nca.ufma.br;

        location / {
            proxy_pass http://cultura-maranhense:3000;
            proxy_redirect default;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $server_name;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}