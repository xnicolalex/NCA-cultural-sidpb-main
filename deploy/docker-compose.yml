x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    build: ../db-postgis-sidpb-cultura    
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      SIDPB_DB_USER: ${SIDPB_DB_USER}
      SIDPB_DB_PASSWORD: ${SIDPB_DB_PASSWORD}
      CULTURA_DB_USER: ${CULTURA_DB_USER}
      CULTURA_DB_PASSWORD: ${CULTURA_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - nca-network

  sidpb_backend:
    build:
      context: ../sidpb-backend-dev
      dockerfile: Dockerfile  
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/db_sidpb
      SPRING_DATASOURCE_USERNAME: ${SIDPB_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${SIDPB_DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - nca-network

  sidpb_frontend:
    build:
      context: ../sidpb-frontend-dev 
      dockerfile: Dockerfile  
      args:
        NEXT_PUBLIC_API_BASE_URL: /sidpb/api
        NEXT_PUBLIC_BASE_PATH: /sidpb   
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3001:3000"
    depends_on:
      - sidpb_backend
    logging: *default-logging
    networks:
      - nca-network

  cultura-maranhense:
    build:
      context: ../Website-fotografo-fork-main 
      dockerfile: Dockerfile 
      args:
        NEXT_PUBLIC_BASE_PATH: /cultura
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://${CULTURA_DB_USER}:${CULTURA_DB_PASSWORD_URL_ENCODED}@db:5432/db_cultura?schema=public 
      JWT_SECRET: ${JWT_SECRET}
      EMAIL_USER: ${EMAIL_USER}
      EMAIL_PASS: ${EMAIL_PASS}
    volumes:
      - uploads_data:/app/public/uploads
    command: >
      sh -c "npx prisma db push && npm start"
    ports:
      - "3002:3000"
    depends_on:
      db:
        condition: service_healthy
    logging: *default-logging
    networks:
      - nca-network

  # nginx:
  #   image: nginx:1.27-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./default.conf:/etc/nginx/conf.d/default.conf:ro
  #   depends_on:
  #     - sidpb_frontend
  #     - sidpb_backend
  #     - cultura-maranhense
  #   logging: *default-logging
  #   networks:
